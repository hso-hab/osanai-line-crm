<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>初期設定｜つながる顧客ノート</title><link rel="stylesheet" href="account.css"><script src="auth.js" defer></script></head><body class="account-page"><main class="account-card"><h1>管理者の初期設定</h1><p>サーバーのローカル接続で、最初の1回だけ設定できます。</p><form id="auth-form" data-mode="setup"><label>表示名<input name="name" maxlength="80" required></label><label>ログインID<input name="login" autocomplete="username" pattern="[a-zA-Z0-9_.@-]{3,100}" required></label><label>パスワード（14文字以上）<input name="password" type="password" autocomplete="new-password" minlength="14" maxlength="200" required></label><button class="primary">管理者を登録</button><p id="auth-message" role="alert"></p></form></main></body></html>
