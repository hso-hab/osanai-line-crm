<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ログイン｜つながる顧客ノート</title><link rel="stylesheet" href="account.css"><script src="auth.js" defer></script></head><body class="account-page"><main class="account-card"><h1>つながる顧客ノート</h1><p>担当者アカウントでログイン</p><form id="auth-form" data-mode="login"><label>ログインID<input name="login" autocomplete="username" maxlength="100" required></label><label>パスワード<input name="password" type="password" autocomplete="current-password" maxlength="200" required></label><button class="primary">ログイン</button><p id="auth-message" role="alert"></p></form><details><summary>ログインできないとき</summary><p>アカウントの管理者に、利用者登録・パスワード再設定を依頼してください。パスワードはチャットへ送らないでください。</p></details></main></body></html>
